bio: Je suis étudiant en Master of Economics (M1) à l'ENS Paris-Saclay et je
  m'intéresse à la gestion de la ressource en eau. Formé à l'Université de Pau
  et des Pays de l'Adour, j'ai travaillé auprès de l'agence de l'eau
  Adour-Garonne et du laboratoire TREE. À côté de la recherche, je réalise des
  films, je fais de la musique et de la photographie.
